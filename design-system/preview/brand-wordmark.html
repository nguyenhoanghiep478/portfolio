<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .icns { display:flex; gap:18px; color:var(--fg-2); }
  .icns svg { width:24px; height:24px; }
  .wm { font-family:var(--font-mono); font-size:26px; font-weight:600; color:var(--fg-1); }
  .wm b { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="spread" style="align-items:center;">
    <span class="wm">hiep<b>.</b>dev</span>
    <span class="ds-eyebrow">// BACKEND ENGINEER</span>
  </div>
  <div class="icns">
    <i data-lucide="server"></i>
    <i data-lucide="database"></i>
    <i data-lucide="terminal"></i>
    <i data-lucide="git-branch"></i>
    <i data-lucide="cpu"></i>
    <i data-lucide="github"></i>
    <i data-lucide="mail"></i>
    <i data-lucide="arrow-up-right"></i>
  </div>
  <div class="meta">Wordmark — JetBrains Mono with sky-blue dot. Icons — Lucide, 2px stroke, currentColor. No emoji.</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
