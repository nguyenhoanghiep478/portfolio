<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="row" style="gap:14px; align-items:stretch;">
    <div class="swatch"><div class="chip" style="background:#38BDF8"></div><div class="chip-label"><span class="chip-name">success</span><span class="chip-val">#38BDF8</span></div></div>
    <div class="swatch"><div class="chip" style="background:#60A5FA"></div><div class="chip-label"><span class="chip-name">info</span><span class="chip-val">#60A5FA</span></div></div>
    <div class="swatch"><div class="chip" style="background:#FBBF24"></div><div class="chip-label"><span class="chip-name">warning</span><span class="chip-val">#FBBF24</span></div></div>
    <div class="swatch"><div class="chip" style="background:#F87171"></div><div class="chip-label"><span class="chip-name">danger</span><span class="chip-val">#F87171</span></div></div>
  </div>
  <div class="meta">Semantic colors exist but stay rare — the sky-blue accent carries almost all signal.</div>
</div>
</body>
</html>
