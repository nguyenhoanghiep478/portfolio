<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .grp { display:flex; flex-direction:column; gap:9px; }
  .grp-label { font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--fg-3); }
  .badges { display:flex; flex-wrap:wrap; gap:8px; }
  .badge { display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:12.5px; color:var(--fg-2); background:var(--bg-2); border:1px solid var(--border); padding:6px 12px; border-radius:var(--radius-pill); white-space:nowrap; transition:all var(--dur-fast) var(--ease-soft); }
  .badge:hover { border-color:var(--accent-line); color:var(--fg-1); }
  .badge img { width:14px; height:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grp">
    <span class="grp-label">Backend</span>
    <div class="badges">
      <span class="badge"><img src="https://cdn.simpleicons.org/springboot/A8B3BF" alt="">Spring Boot</span>
      <span class="badge">REST API</span>
      <span class="badge"><img src="https://cdn.simpleicons.org/jsonwebtokens/A8B3BF" alt="">JWT</span>
      <span class="badge"><img src="https://cdn.simpleicons.org/apachekafka/A8B3BF" alt="">Kafka</span>
    </div>
  </div>
  <div class="grp">
    <span class="grp-label">Database & Cache</span>
    <div class="badges">
      <span class="badge"><img src="https://cdn.simpleicons.org/postgresql/A8B3BF" alt="">PostgreSQL</span>
      <span class="badge"><img src="https://cdn.simpleicons.org/redis/A8B3BF" alt="">Redis</span>
    </div>
  </div>
  <div class="meta">Skill badges — mono pill, optional monochrome brand glyph. Grouped by category, calm hover.</div>
</div>
</body>
</html>
