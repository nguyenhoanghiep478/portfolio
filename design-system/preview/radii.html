<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .rad { flex:1; height:72px; background:var(--bg-2); border:1px solid var(--border-strong); display:flex; align-items:flex-end; justify-content:center; padding:8px; }
  .rad span { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:12px; align-items:stretch;">
    <div class="rad" style="border-radius:6px"><span>sm · 6</span></div>
    <div class="rad" style="border-radius:10px"><span>md · 10</span></div>
    <div class="rad" style="border-radius:14px"><span>lg · 14</span></div>
    <div class="rad" style="border-radius:20px"><span>xl · 20</span></div>
    <div class="rad" style="border-radius:999px"><span>pill</span></div>
  </div>
  <div class="meta">md (10px) default · lg (14px) cards · sm (6px) inputs/code · pill for badges & chips.</div>
</div>
</body>
</html>
