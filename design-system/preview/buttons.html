<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .btn { display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-size:15px; font-weight:600; padding:11px 20px; border-radius:var(--radius-md); border:1px solid transparent; cursor:pointer; transition:all var(--dur-fast) var(--ease-soft); }
  .btn svg { width:17px; height:17px; }
  .btn-primary { background:var(--accent); color:var(--accent-fg); }
  .btn-primary:hover { background:var(--accent-bright); transform:translateY(-2px); box-shadow:var(--shadow-glow); }
  .btn-secondary { background:var(--bg-2); color:var(--fg-1); border-color:var(--border-strong); }
  .btn-secondary:hover { border-color:var(--accent-line); background:var(--bg-3); }
  .btn-ghost { background:transparent; color:var(--fg-2); }
  .btn-ghost:hover { color:var(--accent); }
  .btn:focus-visible { outline:none; box-shadow:var(--ring-focus); }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:14px;">
    <button class="btn btn-primary"><i data-lucide="download"></i> Download CV</button>
    <button class="btn btn-secondary"><i data-lucide="mail"></i> Contact</button>
    <button class="btn btn-ghost">View projects <i data-lucide="arrow-right"></i></button>
  </div>
  <div class="meta">Primary (accent fill) · Secondary (surface + hairline) · Ghost. Hover lifts −2px + brightens; focus shows sky-blue ring.</div>
</div>
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
