<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .tl { position:relative; padding-left:30px; }
  .tl::before { content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--border-strong); }
  .node { position:relative; padding-bottom:22px; }
  .node:last-child { padding-bottom:0; }
  .node::before { content:""; position:absolute; left:-30px; top:4px; width:16px; height:16px; border-radius:50%; background:var(--bg-0); border:2px solid var(--accent); box-shadow:0 0 0 4px var(--accent-dim); }
  .when { font-family:var(--font-mono); font-size:11px; color:var(--accent); letter-spacing:0.04em; }
  .role { font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--fg-1); margin:3px 0 2px; }
  .org { font-size:13px; color:var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="tl">
    <div class="node">
      <div class="when">2025 — PRESENT</div>
      <div class="role">Java Backend Developer</div>
      <div class="org">Boostech · Startup</div>
    </div>
    <div class="node">
      <div class="when">EARLIER</div>
      <div class="role">Freelance &amp; Personal Projects</div>
      <div class="org">Spring Boot · microservices · DSA</div>
    </div>
  </div>
  <div class="meta">Experience timeline — sky-blue ring node on a hairline rail. Mono date, display role, muted org.</div>
</div>
</body>
</html>
