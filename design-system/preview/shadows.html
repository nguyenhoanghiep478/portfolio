<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
<style>
  .el { flex:1; height:84px; border-radius:var(--radius-lg); display:flex; align-items:flex-end; justify-content:center; padding:8px; }
  .el span { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="gap:18px; align-items:stretch; padding:6px 0;">
    <div class="el" style="background:var(--bg-2); box-shadow:var(--shadow-1)"><span>shadow-1</span></div>
    <div class="el" style="background:var(--bg-2); box-shadow:var(--shadow-2)"><span>shadow-2</span></div>
    <div class="el" style="background:var(--bg-3); box-shadow:var(--shadow-3)"><span>shadow-3</span></div>
    <div class="el" style="background:var(--bg-2); box-shadow:var(--shadow-glow)"><span>glow</span></div>
  </div>
  <div class="meta">Deep, soft near-black shadows. Elevation = lighter surface + larger shadow. Only colored shadow is focus/CTA glow.</div>
</div>
</body>
</html>
