<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="row" style="gap:14px; align-items:stretch;">
    <div class="swatch"><div class="chip" style="background:#38BDF8"></div><div class="chip-label"><span class="chip-name">accent</span><span class="chip-val">#38BDF8</span></div></div>
    <div class="swatch"><div class="chip" style="background:#7DD3FC"></div><div class="chip-label"><span class="chip-name">accent-bright</span><span class="chip-val">#7DD3FC</span></div></div>
    <div class="swatch"><div class="chip" style="background:#0EA5E9"></div><div class="chip-label"><span class="chip-name">accent-deep</span><span class="chip-val">#0EA5E9</span></div></div>
    <div class="swatch"><div class="chip" style="background:rgba(56,189,248,0.12); border-color:var(--accent-line)"></div><div class="chip-label"><span class="chip-name">accent-dim</span><span class="chip-val">12% tint</span></div></div>
  </div>
  <div class="meta"><span class="meta-accent">One accent only.</span> Sky-blue — links, eyebrows, key icons, primary CTA, focus ring. Restraint is the rule on dark.</div>
</div>
</body>
</html>
