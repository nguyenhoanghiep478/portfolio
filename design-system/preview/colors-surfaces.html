<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_preview.css">
</head>
<body>
<div class="card">
  <div class="row" style="gap:14px; align-items:stretch;">
    <div class="swatch"><div class="chip" style="background:#0A0C10"></div><div class="chip-label"><span class="chip-name">bg-0</span><span class="chip-val">#0A0C10</span></div></div>
    <div class="swatch"><div class="chip" style="background:#0F1217"></div><div class="chip-label"><span class="chip-name">bg-1</span><span class="chip-val">#0F1217</span></div></div>
    <div class="swatch"><div class="chip" style="background:#141921"></div><div class="chip-label"><span class="chip-name">bg-2</span><span class="chip-val">#141921</span></div></div>
    <div class="swatch"><div class="chip" style="background:#1B212B"></div><div class="chip-label"><span class="chip-name">bg-3</span><span class="chip-val">#1B212B</span></div></div>
    <div class="swatch"><div class="chip" style="background:#07090C"></div><div class="chip-label"><span class="chip-name">bg-inset</span><span class="chip-val">#07090C</span></div></div>
  </div>
  <div class="meta">Surface ladder — deep cool slate, never pure black. Depth from steps + hairline borders, not gradients.</div>
</div>
